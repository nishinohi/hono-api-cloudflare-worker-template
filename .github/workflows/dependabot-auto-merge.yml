name: Dependabot auto-merge

# Dependabot がマージに必要な書き込み権限を得るため pull_request_target を使用。
# リスク軽減策: dependabot[bot] のみに制限、チェックアウトを PR HEAD SHA に固定、
# 権限をジョブ単位で最小化。
on: pull_request_target # zizmor: ignore[dangerous-triggers]

jobs:
  check:
    name: Check update type
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    outputs:
      update-type: ${{ steps.metadata.outputs.update-type }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  ci-and-merge:
    name: CI and auto-merge
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: |
      needs.check.outputs.update-type == 'version-update:semver-patch' ||
      needs.check.outputs.update-type == 'version-update:semver-minor'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Rebase and merge PR
        run: gh pr merge --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
